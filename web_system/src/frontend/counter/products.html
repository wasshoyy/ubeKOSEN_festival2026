<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>inventory.db</title>
<link rel="stylesheet" href="../shared/css/base.css">
<link rel="stylesheet" href="../shared/css/lab-theme.css">
</head>
<body>

<div class="lab-counter-shell">
  <div class="lab-counter-header">
    <a class="lab-counter-link-btn" href="counter.html">← 戻る</a>
    <div class="lab-title">商品管理</div>
    <button class="lab-counter-link-btn" id="edit-btn">編集</button>
  </div>

  <table class="lab-table">
    <thead>
      <tr>
        <th>商品</th>
        <th>金額</th>
        <th>在庫</th>
      </tr>
    </thead>
    <tbody id="product-table-body">
      <!-- 商品行はJSでproducts.jsから描画する -->
    </tbody>
  </table>
</div>

<!-- 編集確定の確認モーダル -->
<div class="lab-modal-overlay" id="confirm-overlay">
  <div class="lab-modal">
    <div class="lab-modal-head">
      <span class="lab-modal-title">CONFIRM</span>
    </div>
    <p style="font-size:13px; text-align:center; margin: 10px 0 16px;">編集内容を確定しますか</p>
    <div class="lab-confirm-modal-buttons">
      <button class="lab-confirm-no" id="confirm-no">キャンセル</button>
      <button class="lab-confirm-yes" id="confirm-yes">確定する</button>
    </div>
  </div>
</div>

<script src="../shared/js/data.js"></script>
<script src="../shared/js/products.js"></script>
</body>
</html>
