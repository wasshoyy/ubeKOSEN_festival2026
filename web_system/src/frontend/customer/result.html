<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>trial_report.log</title>
<link rel="stylesheet" href="../shared/css/base.css">
<link rel="stylesheet" href="../shared/css/lab-theme.css">
</head>
<body>

<div class="lab-device">
  <div class="lab-header">
    <div class="lab-title">制御科監修スープ研究所</div>
    <div class="lab-version">RESULT / v1.0</div>
  </div>

  <div class="lab-report-stamp"><span>SUCCESS</span></div>
  <div class="lab-report-id">実験番号：<span id="result-order-id">-</span>　合計：<span id="result-order-total">-</span></div>

  <div class="lab-result-message">
    <div class="lab-result-line1">本日の実験にご協力いただき<br>ありがとうございました</div>
    <div class="lab-result-line2">ごゆっくりお楽しみください</div>
  </div>

  <button class="lab-exit-btn" id="exit-btn">退室する</button>
  <div class="lab-exit-note" id="exit-note">退室ボタンを押すと、席が解放されます</div>
</div>

<script src="../shared/js/result.js"></script>
</body>
</html>
